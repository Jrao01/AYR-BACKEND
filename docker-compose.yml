name: ayr-backend

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ayr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ayr}
      POSTGRES_DB: ${POSTGRES_DB:-ayr}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ayr}:${POSTGRES_PASSWORD:-ayr}@db:5432/${POSTGRES_DB:-ayr}?schema=public
      UPLOAD_DIR: /app/uploads
      CONTACT_UPLOAD_DIR: /app/contact-uploads
      NODE_ENV: production
    ports:
      - "${PORT:-2000}:2000"
    volumes:
      # Volúmenes nombrados: persisten fuera del ciclo de vida del contenedor.
      # No se pierden con `docker compose down` ni al hacer redeploy en Dokploy.
      # Se recomienda crear estos volúmenes una vez en el host con:
      #   docker volume create uploads_data contact_uploads_data
      - uploads_data:/app/uploads
      - contact_uploads_data:/app/contact-uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  pgdata:
  uploads_data:
  contact_uploads_data:
